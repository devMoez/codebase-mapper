<!DOCTYPE html>
<html>
<head>
    <title>Ultron CNS Dashboard</title>
    <script src="https://unpkg.com/3d-force-graph"></script>
    <script src="https://unpkg.com/three"></script>
    <style>
        :root { 
            --bg: #0a0a0f; 
            --panel: #16161e; 
            --text: #a9b1d6; 
            --accent: #7aa2f7;
            --folder: #ff9e64;
            --file: #e0af68;
        }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        #sidebar-left, #sidebar-right { position: absolute; top: 0; width: 280px; height: 100vh; background: var(--panel); padding: 20px; z-index: 10; border: 1px solid #292e42; }
        #sidebar-left { left: 0; } 
        #sidebar-right { right: 0; overflow-y: auto; }
        h3 { color: var(--accent); border-bottom: 1px solid #292e42; padding-bottom: 10px; }
        .item { padding: 4px 8px; font-size: 14px; transition: 0.2s; }
        .item:hover { background: #292e42; color: #fff; }
        .legend-item { display: flex; align-items: center; margin-bottom: 10px; font-size: 14px; }
        .swatch { width: 14px; height: 14px; margin-right: 10px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="sidebar-left">
        <h3>Legend</h3>
        <div class="legend-item"><div class="swatch" style="background:var(--file)"></div>File</div>
        <div class="legend-item"><div class="swatch" style="background:var(--folder)"></div>Folder</div>
    </div>

    <div id="sidebar-right"><h3>Project Tree</h3><div id="tree"></div></div>
    <div id="3d-graph"></div>

    <script>
        const Graph = ForceGraph3D()(document.getElementById('3d-graph'))
            .backgroundColor('#0a0a0f')
            .nodeThreeObject(node => {
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(node.type === 'folder' ? 6 : 3),
                    new THREE.MeshLambertMaterial({ 
                        color: node.type === 'folder' ? '#ff9e64' : '#e0af68',
                        transparent: true, opacity: 0.9 
                    })
                );
                return mesh;
            })
            .linkMaterial(new THREE.MeshLambertMaterial({ color: '#565f89', transparent: true, opacity: 0.3 }))
            .onNodeClick(n => { /* Node click interaction */ });

        // Add 3D Starfield for depth
        const scene = Graph.scene();
        const stars = new THREE.Points(
            new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(Array.from({length: 3000}, () => (Math.random()-0.5)*2000), 3)),
            new THREE.PointsMaterial({ size: 1.5, color: 0xffffff })
        );
        scene.add(stars);

        // Fetch & Build Tree
        fetch('/api/file-tree').then(r=>r.json()).then(data => {
            const container = document.getElementById('tree');
            const render = (node) => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = (node.type==='directory'?'📁':'📄') + ' ' + node.name;
                if(node.children) {
                    node.children.forEach(c => div.appendChild(render(c)));
                }
                return div;
            };
            container.appendChild(render(data));
        });

        fetch('/api/graph').then(r=>r.json()).then(data => Graph.graphData(data));
    </script>
</body>
</html>
